name: Derleme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Derle
        run: dotnet build clipdeck.csproj -c Release

      - name: Test
        run: dotnet test tests/clipdeck.Tests/clipdeck.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Paketle
        run: ./build.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: clipdeck
          path: |
            dist/clipdeck.exe
            dist/clipdeck-kurulum.exe
          retention-days: 14

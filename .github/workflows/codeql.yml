name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          # Security queries only: the quality suite mostly flags generated code (regex source generator, XAML).
          queries: security-extended

      - name: Derle
        run: dotnet build clipdeck.csproj -c Release

      - uses: github/codeql-action/analyze@v4
